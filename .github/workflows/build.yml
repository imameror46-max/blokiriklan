name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Tulis proyek
        run: |
          mkdir -p proj/app/src/main/java/com/blokir/iklan
          cd proj
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BlokirIklan"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.blokir.iklan"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.blokir.iklan"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="Blokir Iklan"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlockVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/blokir/iklan/Store.kt <<'EOF'
          package com.blokir.iklan

          import android.content.Context
          import android.content.SharedPreferences

          class LogItem(val host: String, val blocked: Boolean)

          object Store {
              private var p: SharedPreferences? = null
              @Volatile var running = false
              @Volatile var version = 0
              private val log = ArrayList<LogItem>()

              private val defDomains = setOf("zi389vvu4j.com", "yy739vy33.com")
              private val defKeywords = setOf("slot", "gacor", "togel", "judi", "maxwin", "st88")

              fun init(c: Context) {
                  if (p == null) p = c.applicationContext.getSharedPreferences("blokir", Context.MODE_PRIVATE)
              }

              private fun get(k: String, d: Set<String>): Set<String> = HashSet(p!!.getStringSet(k, d) ?: d)
              private fun put(k: String, s: Set<String>) { p!!.edit().putStringSet(k, s).apply(); version++ }

              fun addDomain(d: String) { put("d", get("d", defDomains) + d) }
              fun removeDomain(d: String) { put("d", get("d", defDomains) - d) }
              fun addKeyword(k: String) { put("k", get("k", defKeywords) + k) }
              fun hasDomain(d: String): Boolean = get("d", defDomains).contains(d)

              fun isBlocked(h: String): Boolean {
                  for (d in get("d", defDomains)) if (h == d || h.endsWith(".$d")) return true
                  for (k in get("k", defKeywords)) if (h.contains(k)) return true
                  return false
              }

              fun addLog(h: String, b: Boolean) {
                  synchronized(log) {
                      val it = log.iterator()
                      while (it.hasNext()) { if (it.next().host == h) it.remove() }
                      log.add(0, LogItem(h, b))
                      while (log.size > 300) log.removeAt(log.size - 1)
                      version++
                  }
              }

              fun snapshot(): List<LogItem> = synchronized(log) { ArrayList(log) }
          }
          EOF
          cat > app/src/main/java/com/blokir/iklan/BlockVpnService.kt <<'EOF'
          package com.blokir.iklan

          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.util.concurrent.Executors

          class BlockVpnService : VpnService() {
              private var tun: ParcelFileDescriptor? = null
              @Volatile private var active = false
              private val pool = Executors.newFixedThreadPool(8)

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  Store.init(this)
                  if (intent?.action == "STOP") { shutdown(); return START_NOT_STICKY }
                  startVpn()
                  return START_STICKY
              }

              private fun startVpn() {
                  if (active) return
                  val fd = Builder()
                      .setSession("Blokir Iklan")
                      .addAddress("10.111.0.1", 32)
                      .addDnsServer("10.111.0.2")
                      .addRoute("10.111.0.2", 32)
                      .setBlocking(true)
                      .establish() ?: return
                  tun = fd
                  active = true
                  Store.running = true
                  Thread { loop(fd) }.start()
              }

              private fun loop(fd: ParcelFileDescriptor) {
                  val inp = FileInputStream(fd.fileDescriptor)
                  val out = FileOutputStream(fd.fileDescriptor)
                  val buf = ByteArray(32767)
                  try {
                      while (active) {
                          val n = inp.read(buf)
                          if (n < 0) break
                          if (n < 28) continue
                          if ((buf[0].toInt() shr 4) != 4) continue
                          val ihl = (buf[0].toInt() and 0x0F) * 4
                          if (buf[9].toInt() != 17 || n < ihl + 8 + 12) continue
                          val dport = ((buf[ihl + 2].toInt() and 0xFF) shl 8) or (buf[ihl + 3].toInt() and 0xFF)
                          if (dport != 53) continue
                          val pkt = buf.copyOf(n)
                          pool.execute { handle(pkt, ihl, out) }
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun handle(pkt: ByteArray, ihl: Int, out: FileOutputStream) {
                  val dns = pkt.copyOfRange(ihl + 8, pkt.size)
                  val host = qname(dns) ?: return
                  if (Store.isBlocked(host)) {
                      Store.addLog(host, true)
                      dns[2] = 0x81.toByte()
                      dns[3] = 0x83.toByte()
                      reply(pkt, ihl, dns, out)
                  } else {
                      Store.addLog(host, false)
                      forward(pkt, ihl, dns, out)
                  }
              }

              private fun forward(pkt: ByteArray, ihl: Int, dns: ByteArray, out: FileOutputStream) {
                  try {
                      DatagramSocket().use { s ->
                          protect(s)
                          s.soTimeout = 4000
                          s.connect(InetAddress.getByName("1.1.1.1"), 53)
                          s.send(DatagramPacket(dns, dns.size))
                          val rb = ByteArray(4096)
                          val rp = DatagramPacket(rb, rb.size)
                          s.receive(rp)
                          reply(pkt, ihl, rb.copyOf(rp.length), out)
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun qname(d: ByteArray): String? {
                  var i = 12
                  val sb = StringBuilder()
                  while (i < d.size) {
                      val l = d[i].toInt() and 0xFF
                      if (l == 0) break
                      if (l > 63 || i + 1 + l > d.size) return null
                      if (sb.isNotEmpty()) sb.append('.')
                      sb.append(String(d, i + 1, l, Charsets.US_ASCII))
                      i += l + 1
                  }
                  return if (sb.isEmpty()) null else sb.toString().lowercase()
              }

              private fun reply(req: ByteArray, ihl: Int, dns: ByteArray, out: FileOutputStream) {
                  val total = ihl + 8 + dns.size
                  val o = ByteArray(total)
                  System.arraycopy(req, 0, o, 0, ihl + 8)
                  System.arraycopy(req, 16, o, 12, 4)
                  System.arraycopy(req, 12, o, 16, 4)
                  o[ihl] = req[ihl + 2]; o[ihl + 1] = req[ihl + 3]
                  o[ihl + 2] = req[ihl]; o[ihl + 3] = req[ihl + 1]
                  o[2] = (total shr 8).toByte(); o[3] = total.toByte()
                  o[8] = 64
                  o[10] = 0; o[11] = 0
                  val udpLen = 8 + dns.size
                  o[ihl + 4] = (udpLen shr 8).toByte(); o[ihl + 5] = udpLen.toByte()
                  o[ihl + 6] = 0; o[ihl + 7] = 0
                  System.arraycopy(dns, 0, o, ihl + 8, dns.size)
                  var sum = 0
                  var i = 0
                  while (i < ihl) {
                      sum += ((o[i].toInt() and 0xFF) shl 8) or (o[i + 1].toInt() and 0xFF)
                      i += 2
                  }
                  while ((sum shr 16) != 0) sum = (sum and 0xFFFF) + (sum shr 16)
                  val cs = sum.inv() and 0xFFFF
                  o[10] = (cs shr 8).toByte(); o[11] = cs.toByte()
                  synchronized(out) { out.write(o) }
              }

              private fun shutdown() {
                  active = false
                  Store.running = false
                  try { tun?.close() } catch (_: Exception) {}
                  tun = null
                  stopSelf()
              }

              override fun onRevoke() { shutdown() }
              override fun onDestroy() { shutdown(); super.onDestroy() }
          }
          EOF
          cat > app/src/main/java/com/blokir/iklan/MainActivity.kt <<'EOF'
          package com.blokir.iklan

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.net.VpnService
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private val h = Handler(Looper.getMainLooper())
              private lateinit var btn: Button
              private lateinit var adapter: ArrayAdapter<String>
              private var items: List<LogItem> = emptyList()
              private var seen = -1

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  Store.init(this)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(16), dp(40), dp(16), dp(8))

                  val info = TextView(this)
                  info.text = "Matikan DNS Pribadi di Pengaturan dulu. Nyalakan pemblokir, lalu buka Melolo. " +
                      "Domain yang diminta HP muncul di bawah. Tap domain judi untuk memblokirnya."
                  root.addView(info)

                  btn = Button(this)
                  btn.setOnClickListener { toggle() }
                  root.addView(btn)

                  val row = LinearLayout(this)
                  val input = EditText(this)
                  input.hint = "domain atau kata kunci"
                  input.setSingleLine()
                  val add = Button(this)
                  add.text = "Blokir"
                  add.setOnClickListener {
                      val t = input.text.toString().trim().lowercase()
                      if (t.isNotEmpty()) {
                          if (t.contains('.')) Store.addDomain(t) else Store.addKeyword(t)
                          input.setText("")
                          Toast.makeText(this, "Ditambahkan: $t", Toast.LENGTH_SHORT).show()
                      }
                  }
                  row.addView(input, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  row.addView(add)
                  root.addView(row)

                  val list = ListView(this)
                  adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, ArrayList<String>())
                  list.adapter = adapter
                  list.setOnItemClickListener { _, _, pos, _ ->
                      if (pos < items.size) askItem(items[pos])
                  }
                  root.addView(list, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(root)
              }

              private fun askItem(it: LogItem) {
                  val inList = Store.hasDomain(it.host)
                  val msg = if (it.blocked) {
                      if (inList) "Hapus ${it.host} dari daftar blokir?" else "${it.host} diblokir oleh kata kunci."
                  } else "Blokir ${it.host}?"
                  val d = AlertDialog.Builder(this).setMessage(msg).setNegativeButton("Batal", null)
                  if (!it.blocked) d.setPositiveButton("Blokir") { _, _ -> Store.addDomain(it.host) }
                  else if (inList) d.setPositiveButton("Hapus") { _, _ -> Store.removeDomain(it.host) }
                  d.show()
              }

              private fun toggle() {
                  if (Store.running) {
                      val i = Intent(this, BlockVpnService::class.java)
                      i.action = "STOP"
                      startService(i)
                  } else {
                      val p = VpnService.prepare(this)
                      if (p != null) startActivityForResult(p, 1) else startVpn()
                  }
              }

              private fun startVpn() { startService(Intent(this, BlockVpnService::class.java)) }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  if (req == 1 && res == RESULT_OK) startVpn()
              }

              private val tick = object : Runnable {
                  override fun run() { refresh(); h.postDelayed(this, 800) }
              }

              override fun onResume() { super.onResume(); tick.run() }
              override fun onPause() { super.onPause(); h.removeCallbacks(tick) }

              private fun refresh() {
                  btn.text = if (Store.running) "Matikan pemblokir" else "Nyalakan pemblokir"
                  if (seen != Store.version) {
                      seen = Store.version
                      items = Store.snapshot()
                      adapter.clear()
                      adapter.addAll(items.map { (if (it.blocked) "⛔ " else "✅ ") + it.host })
                  }
              }
          }
          EOF
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BlokirIklan-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
