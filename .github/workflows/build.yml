          package com.blokir.iklan

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.net.VpnService
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private val h = Handler(Looper.getMainLooper())
              private lateinit var btn: Button
              private lateinit var agg: Button
              private lateinit var skip: Button
              private lateinit var st: TextView
              private lateinit var st2: TextView
              private lateinit var adapter: ArrayAdapter<String>
              private var items: List<LogItem> = emptyList()
              private var seen = -1

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun w() = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)

              private fun launcherApps(): List<ResolveInfo> {
                  val i = Intent(Intent.ACTION_MAIN)
                  i.addCategory(Intent.CATEGORY_LAUNCHER)
                  return packageManager.queryIntentActivities(i, 0)
              }

              private fun defaultApps(): Set<String> {
                  val known = setOf(
                      "com.android.chrome", "org.mozilla.firefox", "org.mozilla.fenix", "com.brave.browser",
                      "com.opera.browser", "com.opera.mini.native", "com.sec.android.app.sbrowser",
                      "com.microsoft.emmx", "com.kiwibrowser.browser", "org.chromium.chrome",
                      "com.duckduckgo.mobile.android", "com.UCMobile.intl"
                  )
                  val s = HashSet<String>()
                  for (ri in launcherApps()) {
                      val pkg = ri.activityInfo.packageName
                      val label = ri.loadLabel(packageManager).toString().lowercase()
                      if (known.contains(pkg) || label.contains("melolo")) s.add(pkg)
                  }
                  return s
              }

              private fun pickApps() {
                  val list = launcherApps()
                      .filter { it.activityInfo.packageName != packageName }
                      .distinctBy { it.activityInfo.packageName }
                      .sortedBy { it.loadLabel(packageManager).toString().lowercase() }
                  val names = list.map { it.loadLabel(packageManager).toString() }.toTypedArray()
                  val pkgs = list.map { it.activityInfo.packageName }
                  val sel: Set<String> = Store.apps() ?: HashSet<String>()
                  val checked = BooleanArray(pkgs.size) { sel.contains(pkgs[it]) }
                  AlertDialog.Builder(this)
                      .setTitle("Aplikasi untuk lewati otomatis")
                      .setMultiChoiceItems(names, checked) { _, which, isChecked -> checked[which] = isChecked }
                      .setPositiveButton("Simpan") { _, _ ->
                          val n = HashSet<String>()
                          for (i in pkgs.indices) if (checked[i]) n.add(pkgs[i])
                          Store.setApps(n)
                      }
                      .setNegativeButton("Batal", null)
                      .show()
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  Store.init(this)
                  if (!Store.hasList()) Store.update()
                  if (Store.apps() == null) Store.setApps(defaultApps())

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(16), dp(32), dp(16), dp(8))

                  val info = TextView(this)
                  info.text = "Berlaku untuk semua aplikasi dan browser. Matikan DNS Pribadi di Pengaturan " +
                      "dan DNS aman di Chrome dulu. Tap domain di daftar untuk memblokir atau mengizinkannya."
                  root.addView(info)

                  btn = Button(this)
                  btn.setOnClickListener { toggle() }
                  root.addView(btn)

                  val row2 = LinearLayout(this)
                  val upd = Button(this)
                  upd.text = "Perbarui daftar"
                  upd.setOnClickListener { Store.update() }
                  agg = Button(this)
                  agg.setOnClickListener {
                      Store.setAggressive(!Store.aggressiveOn())
                      if (Store.aggressiveOn()) {
                          Toast.makeText(this, "Jika Melolo error, matikan lagi mode agresif", Toast.LENGTH_LONG).show()
                      }
                  }
                  row2.addView(upd, w())
                  row2.addView(agg, w())
                  root.addView(row2)

                  st = TextView(this)
                  root.addView(st)

                  val row3 = LinearLayout(this)
                  skip = Button(this)
                  skip.setOnClickListener { Store.setSkip(!Store.skipOn()) }
                  val pick = Button(this)
                  pick.text = "Pilih aplikasi"
                  pick.setOnClickListener { pickApps() }
                  row3.addView(skip, w())
                  row3.addView(pick, w())
                  root.addView(row3)

                  val acc = Button(this)
                  acc.text = "Aktifkan layanan lewati otomatis"
                  acc.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  root.addView(acc)

                  st2 = TextView(this)
                  root.addView(st2)

                  val row = LinearLayout(this)
                  val input = EditText(this)
                  input.hint = "domain atau kata kunci"
                  input.setSingleLine()
                  val add = Button(this)
                  add.text = "Blokir"
                  add.setOnClickListener {
                      val t = input.text.toString().trim().lowercase()
                      if (t.isNotEmpty()) {
                          if (t.contains('.')) Store.addDomain(t) else Store.addKeyword(t)
                          input.setText("")
                          Toast.makeText(this, "Ditambahkan: $t", Toast.LENGTH_SHORT).show()
                      }
                  }
                  row.addView(input, w())
                  row.addView(add)
                  root.addView(row)

                  val list = ListView(this)
                  adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, ArrayList<String>())
                  list.adapter = adapter
                  list.setOnItemClickListener { _, _, pos, _ ->
                      if (pos < items.size) askItem(items[pos])
                  }
                  root.addView(list, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(root)
              }

              private fun askItem(it: LogItem) {
                  val d = AlertDialog.Builder(this).setNegativeButton("Batal", null)
                  if (!it.blocked) {
                      d.setMessage("Blokir ${it.host}?")
                      d.setPositiveButton("Blokir") { _, _ -> Store.addDomain(it.host) }
                  } else {
                      d.setMessage("Izinkan ${it.host}?")
                      d.setPositiveButton("Izinkan") { _, _ -> Store.allow(it.host) }
                  }
                  d.show()
              }

              private fun toggle() {
                  if (Store.running) {
                      val i = Intent(this, BlockVpnService::class.java)
                      i.action = "STOP"
                      startService(i)
                  } else {
                      val p = VpnService.prepare(this)
                      if (p != null) startActivityForResult(p, 1) else startVpn()
                  }
              }

              private fun startVpn() { startService(Intent(this, BlockVpnService::class.java)) }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  if (req == 1 && res == RESULT_OK) startVpn()
              }

              private val tick = object : Runnable {
                  override fun run() { refresh(); h.postDelayed(this, 800) }
              }

              override fun onResume() { super.onResume(); tick.run() }
              override fun onPause() { super.onPause(); h.removeCallbacks(tick) }

              private fun refresh() {
                  btn.text = if (Store.running) "Matikan pemblokir" else "Nyalakan pemblokir"
                  agg.text = if (Store.aggressiveOn()) "Agresif: nyala" else "Agresif: mati"
                  skip.text = if (Store.skipOn()) "Lewati: nyala" else "Lewati: mati"
                  st.text = Store.statusText()
                  st2.text = if (SkipService.connected) "Layanan lewati otomatis: aktif" else "Layanan lewati otomatis: belum aktif"
                  if (seen != Store.version) {
                      seen = Store.version
                      items = Store.snapshot()
                      adapter.clear()
                      adapter.addAll(items.map { (if (it.blocked) "⛔ " else "✅ ") + it.host })
                  }
              }
          }
          EOF
          sed -i "s|android:allowBackup=\"false\"|android:allowBackup=\"false\" $ICON|" app/src/main/AndroidManifest.xml
