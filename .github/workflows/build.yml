          cat > app/src/main/java/com/blokir/iklan/SkipService.kt <<'EOF'
          package com.blokir.iklan

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class SkipService : AccessibilityService() {
              companion object {
                  @Volatile var connected = false
              }

              private val h = Handler(Looper.getMainLooper())
              private var pending = false
              private var last = 0L
              private var budget = 0

              private val exact = setOf(
                  "lewati", "lewati iklan", "skip", "skip ad", "skip ads", "skip all", "skip video",
                  "tutup iklan", "close ad", "close ads", "tutup", "close", "x", "×", "✕", "✖"
              )

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Store.init(this)
                  connected = true
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  connected = false
                  return super.onUnbind(intent)
              }

              override fun onInterrupt() {}

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null || pending) return
                  if (!Store.skipOn()) return
                  val pkg = e.packageName?.toString() ?: return
                  if (!Store.appSelected(pkg)) return
                  pending = true
                  h.postDelayed({
                      pending = false
                      scan(pkg)
                  }, 500)
              }

              private fun scan(pkg: String) {
                  val now = System.currentTimeMillis()
                  if (now - last < 1500) return
                  val root = rootInActiveWindow ?: return
                  if (root.packageName?.toString() != pkg) return
                  budget = 3000
                  val n = find(root, 0) ?: return
                  if (click(n)) last = now
              }

              private fun find(n: AccessibilityNodeInfo?, depth: Int): AccessibilityNodeInfo? {
                  if (n == null || depth > 40 || budget-- <= 0) return null
                  if (n.isVisibleToUser) {
                      val t = (n.text?.toString() ?: n.contentDescription?.toString() ?: "").trim().lowercase()
                      if (t.isNotEmpty() && t.length <= 15 && match(t)) return n
                  }
                  for (i in 0 until n.childCount) {
                      val r = find(n.getChild(i), depth + 1)
                      if (r != null) return r
                  }
                  return null
              }

              private fun match(t: String): Boolean {
                  if (exact.contains(t)) return true
                  return (t.startsWith("skip") || t.startsWith("lewati")) && t.length <= 12
              }

              private fun click(n: AccessibilityNodeInfo): Boolean {
                  var c: AccessibilityNodeInfo? = n
                  var up = 0
                  while (c != null && up < 5) {
                      if (c.isClickable && c.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
                      c = c.parent
                      up++
                  }
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  if (r.width() <= 0 || r.height() <= 0) return false
                  val path = Path()
                  path.moveTo(r.exactCenterX(), r.exactCenterY())
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 60))
                      .build()
                  return dispatchGesture(g, null, null)
              }
          }
